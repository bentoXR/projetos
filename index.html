<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projetos — bentoXR</title>
  <style>
    :root {
      --bg: #0b0f17;
      --surface: #131a26;
      --border: #232d3f;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 48px 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 36px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    header p {
      color: var(--muted);
      font-size: 1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.2s, transform 0.2s;
    }

    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .card h2 {
      font-size: 1.125rem;
      margin-bottom: 6px;
      color: var(--accent);
    }

    .card:hover h2 {
      color: var(--accent-hover);
    }

    .card p {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .tag {
      display: inline-block;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(88, 166, 255, 0.12);
      color: var(--accent);
      width: fit-content;
    }

    footer {
      margin-top: 48px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Projetos — bentoXR</h1>
      <p>Coleção unificada de páginas e aplicações front-end hospedadas no GitHub Pages.</p>
    </header>

    <main class="grid" id="projects-grid">
      <p style="color: var(--muted);">Carregando projetos...</p>
    </main>

    <footer>
      <p>Código-fonte em <a href="https://github.com/bentoXR/projetos" target="_blank" rel="noopener">github.com/bentoXR/projetos</a></p>
    </footer>
  </div>

  <script>
    async function loadProjects() {
      const grid = document.getElementById("projects-grid");
      try {
        const res = await fetch("./projects.json", { cache: "no-cache" });
        if (!res.ok) throw new Error("Falha ao carregar projects.json");
        const projects = await res.json();

        if (!Array.isArray(projects) || projects.length === 0) {
          grid.innerHTML = '<p style="color: var(--muted);">Nenhum projeto encontrado em <code>front-end/</code>.</p>';
          return;
        }

        grid.innerHTML = "";
        for (const project of projects) {
          const card = document.createElement("a");
          card.className = "card";
          card.href = project.href;

          const info = document.createElement("div");
          const title = document.createElement("h2");
          title.textContent = project.title;
          const desc = document.createElement("p");
          desc.textContent = project.description;
          info.append(title, desc);

          const tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = project.tag;

          card.append(info, tag);
          grid.appendChild(card);
        }
      } catch (err) {
        console.error(err);
        grid.innerHTML = '<p style="color: var(--muted);">Não foi possível carregar a lista de projetos.</p>';
      }
    }

    loadProjects();
  </script>
</body>
</html>
