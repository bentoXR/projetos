<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poríferos: as esponjas do mar</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a4a55;--ink:#04222b;--y:#ffd84d;--k:#ff7a59;--t:#1b8a8f;--s:#e8b94a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:#fff;font-family:Figtree,system-ui,sans-serif;overflow:hidden;transition:background-color .6s}
html[data-s="1"]{--bg:#12306b}html[data-s="2"]{--bg:#0b5a43}html[data-s="3"]{--bg:#6b1f3a}
#app{height:100%;position:relative;display:flex;flex-direction:column;background:radial-gradient(70vmin 60vmin at 90% 0,#ffffff26,transparent),radial-gradient(70vmin 70vmin at 0 100%,#0006,transparent)}
#bub{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#bub i{position:absolute;bottom:-6vmin;border:1px solid #ffffff50;border-radius:50%;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) translateX(3vmin)}}
.steps{position:relative;z-index:2;display:flex;gap:1.5vmin;padding:2vmin 5vw 0;font-size:max(2vmin,12px);font-weight:800}
.st{flex:1;padding-top:1vmin;border-top:.8vmin solid #ffffff55;color:#ffffffb8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.done{border-color:#fff;color:#fff}.st.on{border-color:var(--y);color:var(--y)}
#sl{flex:1;min-height:0;position:relative;z-index:1;display:flex;flex-direction:column;justify-content:safe center;gap:3vmin;padding:2vmin 6vw 10vmin;overflow-y:auto;overflow-x:hidden}
#sl>*{flex-shrink:0;max-width:100%}
.ctr{align-items:center;text-align:center}
h1{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;font-size:clamp(38px,9vmin,124px);line-height:1.04;letter-spacing:-.025em}
h2{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;font-size:clamp(30px,6.4vmin,86px);line-height:1.1}
.lead{font-size:clamp(22px,4.6vmin,60px);font-weight:700;line-height:1.25;max-width:30ch}
.hi{color:var(--y)}
.grid{display:grid;gap:2.4vmin;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.c{background:#f6fcfb;color:var(--ink);border-radius:2vmin;border-top:1.2vmin solid var(--k);padding:2.6vmin 3vmin;font-size:clamp(20px,4vmin,54px);font-weight:700;line-height:1.25;box-shadow:0 1vmin 3vmin #0005}
.c b{display:block;font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;font-size:1.35em;margin-bottom:.6vmin;line-height:1.1}
.c.t{border-top-color:var(--t)}.c.s{border-top-color:var(--s)}
.row{display:flex;gap:3vw;align-items:center;justify-content:center;flex-wrap:wrap}
.row>*{flex:1 1 300px;min-width:0}
.flow{display:flex;align-items:stretch;gap:1.4vmin;flex-wrap:wrap;justify-content:center}
.flow .c{flex:1 1 170px;text-align:center}
.flow .a{flex:0 0 auto;align-self:center;font-size:clamp(28px,5vmin,64px);font-weight:800;color:var(--y)}
.big{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;font-size:clamp(70px,20vmin,260px);line-height:.9;color:var(--y)}
.ph{width:100%;max-height:50vmin;object-fit:cover;border-radius:2vmin;border:.7vmin solid #fff;box-shadow:0 1vmin 3vmin #0006}.g1{grid-template-columns:1fr}.g2{grid-template-columns:1fr 1fr}
.c svg{width:auto;height:17vmin;max-height:none;margin:0 auto 1vmin}.fg{animation:wag .7s ease-in-out infinite alternate;transform-origin:140px 172px}@keyframes wag{from{transform:skewX(-9deg)}to{transform:skewX(9deg)}}.pt{animation:pt 3s linear infinite}@keyframes pt{0%{opacity:0;transform:translateY(40px)}25%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}
.col{display:flex;flex-direction:column;gap:2.4vmin}
svg{width:100%;max-height:66vmin;height:auto;display:block;margin:auto}
.fl{stroke-dasharray:10 12;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-22}}
.sw{animation:sway 5s ease-in-out infinite;transform-origin:200px 380px}
@keyframes sway{50%{transform:rotate(1.6deg)}}
.pulse{animation:pl 2.4s ease-in-out infinite}
@keyframes pl{50%{opacity:.35}}
.in>*{animation:up .6s cubic-bezier(.2,.8,.2,1) both}
.in>*:nth-child(2){animation-delay:.12s}.in>*:nth-child(3){animation-delay:.24s}.in>*:nth-child(4){animation-delay:.36s}
.in .grid>*,.in .flow>*,.in .col>*{animation:pop .5s cubic-bezier(.2,.9,.3,1.2) both}
.in :is(.grid,.flow,.col)>*:nth-child(1){animation-delay:.3s}.in :is(.grid,.flow,.col)>*:nth-child(2){animation-delay:.42s}.in :is(.grid,.flow,.col)>*:nth-child(3){animation-delay:.54s}.in :is(.grid,.flow,.col)>*:nth-child(4){animation-delay:.66s}.in .flow>*:nth-child(5){animation-delay:.78s}.in .flow>*:nth-child(6){animation-delay:.9s}.in .flow>*:nth-child(7){animation-delay:1s}
.op .big{animation:zoom .8s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes up{from{opacity:0;transform:translateY(3vmin)}}
@keyframes pop{from{opacity:0;transform:scale(.88)}}
@keyframes zoom{from{opacity:0;transform:scale(.4)}}
#nav{position:absolute;z-index:3;right:3vw;bottom:calc(2vmin + env(safe-area-inset-bottom,0px));display:flex;gap:1.2vmin;align-items:center;font-weight:800;font-size:max(2vmin,14px)}
#nav button{width:max(6vmin,44px);height:max(6vmin,44px);border-radius:50%;border:0;background:#fff;color:var(--ink);font-size:clamp(20px,3.4vmin,36px);font-weight:800;cursor:pointer;transition:background .2s,transform .2s}
#nav button:hover{background:var(--y);transform:scale(1.08)}
#nav button:focus-visible{outline:3px solid var(--y);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
